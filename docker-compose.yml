services:
  frontend:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the browser-facing API URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./server
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the URL of the existing database}
      JWT_SECRET: ${JWT_SECRET:?Set a production JWT secret}
      CLIENT_URL: ${CLIENT_URL:?Set the browser-facing client origin}
      EXPRESS_SERVER_PORT: "5000"
      UPLOAD_DIR: /server/uploads
      AI_SERVICE_URL: "http://ai-service:8000"
      AI_SERVICE_TIMEOUT_MS: "120000"
      ADHERENCE_TIME_ZONE: "Asia/Manila"
      ADHERENCE_ALERT_INTERVAL_MS: "900000"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - backend_uploads:/server/uploads
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    environment:
      # `localhost` here would be the ai-service container, not Ollama.
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "coach-qwen:latest"
      OLLAMA_TIMEOUT_MS: "30000"
      OLLAMA_KEEP_ALIVE: "10m"
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./ai-service/ollama/Modelfile:/models/Modelfile:ro
    depends_on:
      ollama:
        condition: service_healthy
    command: "ollama pull qwen3.5:0.8b && ollama create coach-qwen:latest -f /models/Modelfile"
    restart: "no"

volumes:
  ollama_models:
  backend_uploads:
